# WireGuard add-on options (Settings > Add-ons > WireGuard > Configuration).
# Placeholders: <DDNS_HOSTNAME> = your dynamic-DNS name (e.g. from the Duck DNS add-on),
#               <PI_LAN_IP>     = the Pi's LAN address.
# Keys are generated by the add-on. Never publish them, the QR codes, or the preshared keys.
server:
  host: <DDNS_HOSTNAME>
  addresses:
    - 172.27.66.1            # VPN subnet, any unused private range
  dns:
    - 9.9.9.9                # public DNS resolver
  mtu: 1280                    # needed for cellular, see docs/remote-access.md
  # Only the Pi's HTTPS UI (8123) and Frigate live video (8555) are reachable through the tunnel.
  # Everything else, including SSH (22), is dropped. Traffic towards the VPN is allowed only for replies.
  post_up: >-
    iptables -A INPUT -i %i -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT;
    iptables -A INPUT -i %i -j DROP;
    iptables -A FORWARD -i %i -d <PI_LAN_IP> -p tcp --dport 8123 -j ACCEPT;
    iptables -A FORWARD -i %i -d <PI_LAN_IP> -p tcp --dport 8555 -j ACCEPT;
    iptables -A FORWARD -i %i -d <PI_LAN_IP> -p udp --dport 8555 -j ACCEPT;
    iptables -A FORWARD -i %i -j DROP;
    iptables -A FORWARD -o %i -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT;
    iptables -A FORWARD -o %i -j DROP;
    iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
  # post_down: the same rules with -D instead of -A, in the same order
peers:
  - name: phone
    addresses:
      - 172.27.66.2
    allowed_ips: []
    client_allowed_ips:        # split tunnel: the phone sends only Pi-bound traffic through the VPN
      - <PI_LAN_IP>/32
    pre_shared_key: <GENERATED_BY_ADDON>
