- id: porch_person_notification
  alias: 'Porch: person notification'
  description: When Frigate raises a person alert on the porch camera, send the iPhone
    a notification with the snapshot. At most one notification per minute.
  triggers:
  - trigger: mqtt
    topic: frigate/reviews
  conditions:
  - condition: template
    value_template: '{{ trigger.payload_json.type == ''new'' and trigger.payload_json.after.camera
      == ''porch'' and trigger.payload_json.after.severity == ''alert'' and ''person''
      in trigger.payload_json.after.data.objects }}'
  actions:
  - delay:
      seconds: 2
  - action: notify.mobile_app_YOUR_PHONE
    data:
      title: Porch
      message: Person at the porch ({{ now().strftime('%H:%M') }})
      data:
        image: /api/camera_proxy/camera.porch_camera_last_person
        url: /hassio/ingress/ccab4aaf_frigate
        group: frigate-porch
        push:
          interruption-level: time-sensitive
  - delay:
      seconds: 60
  mode: single
  max_exceeded: silent
- id: security_failed_login
  alias: 'Security: failed login or IP ban'
  description: Push an alert to the iPhone whenever Home Assistant records a failed
    login or bans an IP address.
  triggers:
  - trigger: persistent_notification
    update_type:
    - added
    - updated
    notification_id: http-login
  - trigger: persistent_notification
    update_type:
    - added
    - updated
    notification_id: ip-ban
  actions:
  - action: notify.mobile_app_YOUR_PHONE
    data:
      title: '{{ ''Home Assistant: IP banned'' if trigger.notification.notification_id
        == ''ip-ban'' else ''Home Assistant: failed login'' }}'
      message: '{{ trigger.notification.message | striptags | truncate(200) }}'
      data:
        group: security
        push:
          interruption-level: time-sensitive
  mode: queued
- id: security_update_available
  alias: 'Security: system update available'
  description: Notify the iPhone when a Home Assistant Core, OS or Supervisor update
    is available, so it can be reviewed and installed.
  triggers:
  - trigger: state
    entity_id:
    - update.home_assistant_core_update
    - update.home_assistant_operating_system_update
    - update.home_assistant_supervisor_update
    - update.raspberry_pi_5_firmware
    to: 'on'
  actions:
  - action: notify.mobile_app_YOUR_PHONE
    data:
      title: Update available
      message: '{{ state_attr(trigger.entity_id, ''title'') or trigger.to_state.name
        }}: {{ state_attr(trigger.entity_id, ''installed_version'') }} → {{ state_attr(trigger.entity_id,
        ''latest_version'') }}'
      data:
        group: security
        url: /config/updates
  mode: queued
- id: porch_people_counter
  alias: 'Porch: count people today'
  description: Counts person alerts on the porch camera; resets at midnight.
  triggers:
  - trigger: mqtt
    topic: frigate/reviews
    id: review
  - trigger: time
    at: 00:00:00
    id: midnight
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: midnight
      sequence:
      - action: counter.reset
        target:
          entity_id: counter.porch_people_today
    - conditions:
      - condition: trigger
        id: review
      - condition: template
        value_template: '{{ trigger.payload_json.type == ''new'' and trigger.payload_json.after.camera
          == ''porch'' and trigger.payload_json.after.severity == ''alert'' and ''person''
          in trigger.payload_json.after.data.objects }}'
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.porch_people_today
  mode: queued
- id: ssh_auto_off
  alias: 'Security: SSH auto-off after 2 hours'
  description: Turns the SSH add-on off once it has been on for 2 hours, and tells
    the iPhone. The 15-minute check also catches the case where Home Assistant restarted
    while SSH was on.
  triggers:
  - trigger: state
    entity_id: switch.advanced_ssh_web_terminal
    to: 'on'
    for:
      hours: 2
  - trigger: time_pattern
    minutes: /15
  conditions:
  - condition: state
    entity_id: switch.advanced_ssh_web_terminal
    state: 'on'
  - condition: template
    value_template: '{{ now() - states.switch.advanced_ssh_web_terminal.last_changed
      >= timedelta(hours=2) }}'
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.advanced_ssh_web_terminal
  - action: notify.mobile_app_YOUR_PHONE
    data:
      title: SSH access turned off
      message: SSH was on for 2 hours, so it was switched off automatically.
      data:
        group: security
  mode: single
- id: rdp_over_vpn
  alias: 'Remote access: RDP over VPN'
  description: Opens or closes port 3389 to the PC (<PC_LAN_IP>) for WireGuard VPN
    clients when the dashboard toggle changes, and re-applies the setting after a
    Home Assistant restart. The PC's own firewall only accepts RDP from the Pi.
  triggers:
  - trigger: state
    entity_id: input_boolean.remote_desktop_over_vpn
    to:
    - 'on'
    - 'off'
    id: toggle
  - trigger: homeassistant
    event: start
    id: start
  actions:
  - action: shell_command.rdp_vpn
    data:
      state: '{{ states(''input_boolean.remote_desktop_over_vpn'') }}'
    response_variable: result
  - if:
    - condition: trigger
      id: toggle
    then:
    - action: notify.mobile_app_YOUR_PHONE
      data:
        title: Remote Desktop over VPN {{ 'ON' if is_state('input_boolean.remote_desktop_over_vpn',
          'on') else 'OFF' }}
        message: '{{ ''VPN clients can now reach the PC on port 3389.'' if is_state(''input_boolean.remote_desktop_over_vpn'',
          ''on'') else ''RDP to the PC is closed for VPN clients.'' }} (exit {{ result.returncode
          }})'
        data:
          group: security
  mode: queued
- id: pigeon_visits_counter
  alias: 'Pigeons: count visits today'
  description: Counts porch review items that contain a pigeon (Frigate label 'bird');
    resets at midnight.
  triggers:
  - trigger: mqtt
    topic: frigate/reviews
    id: review
  - trigger: time
    at: 00:00:00
    id: midnight
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: midnight
      sequence:
      - action: counter.reset
        target:
          entity_id: counter.pigeon_visits_today
    - conditions:
      - condition: trigger
        id: review
      - condition: template
        value_template: '{% set p = trigger.payload_json %}{{ p.after.camera == ''porch''
          and ''bird'' in p.after.data.objects and (p.type == ''new'' or ''bird''
          not in p.before.data.objects) }}'
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.pigeon_visits_today
  mode: queued
- id: pigeon_scare_sound
  alias: 'Pigeons: scare-off sound'
  description: When a pigeon shows up during the allowed hours, play a quiet bird-of-prey
    call. Repeats every minute while it stays, at most 3 times. Toggle, hours and
    volume are on the dashboard.
  triggers:
  - trigger: mqtt
    topic: frigate/reviews
  conditions:
  - condition: template
    value_template: '{% set p = trigger.payload_json %}{{ p.after.camera == ''porch''
      and ''bird'' in p.after.data.objects and (p.type == ''new'' or ''bird'' not
      in p.before.data.objects) }}'
  - condition: state
    entity_id: input_boolean.pigeon_scare_sound
    state: 'on'
  - condition: time
    after: input_datetime.pigeon_sound_from
    before: input_datetime.pigeon_sound_until
  actions:
  - repeat:
      sequence:
      - action: script.play_pigeon_scare_sound
      - delay:
          seconds: 60
      until:
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.porch_camera_pigeon
          state: 'off'
        - condition: state
          entity_id: input_boolean.pigeon_scare_sound
          state: 'off'
        - condition: template
          value_template: '{{ repeat.index >= 3 }}'
  mode: single
  max_exceeded: silent
