
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Remote Desktop over the WireGuard VPN: opens/closes port 3389 to the PC in the VPN firewall.
# Driven by input_boolean.remote_desktop_over_vpn via automation "Remote access: RDP over VPN".
shell_command:
  rdp_vpn: "python3 /config/rdp_vpn/rdp_vpn.py {{ state }}"
